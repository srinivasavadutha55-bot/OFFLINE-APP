name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: OFFLINE-APP
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp OFFLINE-APP/app/build/outputs/apk/debug/app-debug.apk SignalShield.apk

      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignalShield-apk
          path: SignalShield.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SignalShield latest APK
          body: Debug build of the latest commit. Download SignalShield.apk below.
          prerelease: true
          files: SignalShield.apk
